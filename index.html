<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Techie's Taste — momos, rolls, chowmein, paranthas and egg specials, cooked fresh for hungry techies. Starting at ₹30."
    />
    <meta property="og:title" content="Techie's Taste — Good Food · Happy Vibes" />
    <meta
      property="og:description"
      content="Fresh, tasty and affordable canteen food. Browse the menu, plan a meal for your budget and order on WhatsApp."
    />
    <meta property="og:image" content="/images/burger.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Techie's Taste — Good Food · Happy Vibes</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("techies-taste:theme") ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f6f2e9" : "#0a0a0a";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
